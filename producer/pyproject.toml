[project]
name = "stock-analysis"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "akshare>=1.18.22",
    "cachetools>=7.1.1",
    "duckdb>=1.4.0",
    "flask>=3.1.3",
    "flask-openapi3[swagger]>=4.3.1",
    "holidays>=0.60",
    "pandas>=3.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.31.0",
    "upstash-redis>=1.7.0",
    "yfinance>=1.3.0",
]

[project.optional-dependencies]
cli = [
    "lark-oapi>=1.6.6",
]
