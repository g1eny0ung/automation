name: Refresh US Market Breadth

on:
  schedule:
    - cron: '17 10 * * 2-6'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-market-breadth-en
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-market-session
        id: session
        with:
          markets: en
          date: yesterday
      - name: Refresh cached breadth snapshot
        if: steps.session.outputs.should_run == 'true'
        shell: bash
        env:
          MARKET_API_TOKEN: ${{ secrets.MARKET_API_TOKEN }}
        run: bash scripts/refresh-market-breadth.sh en
