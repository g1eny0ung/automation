name: Refresh China Market Breadth

on:
  schedule:
    - cron: '7 18 * * 1-5'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-market-breadth-zh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-breadth
        id: prepare
        timeout-minutes: 4
        with:
          market: zh
          date: today
      - name: Refresh cached breadth snapshot
        id: refresh
        if: steps.prepare.outputs.should_run == 'true'
        shell: bash
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: bash scripts/refresh-market-breadth.sh zh
      - name: Summarize breadth refresh
        if: always()
        shell: bash
        env:
          PREPARATION: ${{ steps.prepare.outcome }}
          REFRESH: ${{ steps.refresh.outcome }}
          SHOULD_RUN: ${{ steps.prepare.outputs.should_run }}
        run: >-
          python scripts/summarize_market_breadth.py zh
          --preparation "$PREPARATION" --refresh "$REFRESH" --should-run "$SHOULD_RUN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breadth-zh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/breadth-zh/
          if-no-files-found: warn
          retention-days: 14
